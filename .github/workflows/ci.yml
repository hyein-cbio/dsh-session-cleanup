name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Package checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ['22.23.4', '24.22.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - run: git diff --exit-code && git diff --check

  live:
    name: Live upstream PTY (${{ matrix.os }}, ${{ matrix.cell.pair }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        cell:
          - {pair: validated, node: '22.23.4'}
          # Final PR #1886 merge; v0.19.0 is a separate release commit.
          - {pair: merged-022, node: '24.22.1'}
    env:
      DSH_COMPAT_PAIR: ${{ matrix.cell.pair }}
      # Source identities and versions come from scripts/upstream_pairs.py.
      DSH_COMPAT_HARNESS_ROOT: ${{ github.workspace }}/.ci-upstreams/harness
      DSH_COMPAT_TUI_ROOT: ${{ github.workspace }}/.ci-upstreams/tui
    steps:
      - name: Configure disposable sandbox and evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-compat-results"
          echo "DSH_COMPAT_HOME=$RUNNER_TEMP/dsh-compat-home" >> "$GITHUB_ENV"
          echo "DSH_COMPAT_LOG=$RUNNER_TEMP/dsh-compat-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select pinned upstream pair
        id: upstream
        run: python3 scripts/upstream_pairs.py >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.upstream.outputs.harness_repository }}
          ref: ${{ steps.upstream.outputs.harness_ref }}
          path: .ci-upstreams/harness
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.upstream.outputs.tui_repository }}
          ref: ${{ steps.upstream.outputs.tui_ref }}
          path: .ci-upstreams/tui
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.cell.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.28.5'
          run_install: false
      # Gate each live cell locally so another OS's runner queue cannot block it.
      - name: Check package before upstream integration
        run: |
          npm ci
          npm run check
          npm pack --dry-run
          git diff --exit-code && git diff --check
      - name: Build sources and install an isolated profile
        run: python3 scripts/prepare-upstream-ci.py
      - name: Check final adapter projection and model lifecycle
        if: matrix.cell.pair == 'merged-022'
        working-directory: ${{ env.DSH_COMPAT_TUI_ROOT }}
        env:
          NODE_ENV: production
        run: |
          node --import ./scripts/lib/fake-home.mjs --import tsx/esm scripts/verify-plugin-lifecycle.ts 2>&1 | tee "$DSH_COMPAT_LOG/upstream-projection-lifecycle.log"
          node --import ./scripts/lib/fake-home.mjs --import tsx/esm scripts/verify-durable-model-selection.ts 2>&1 | tee "$DSH_COMPAT_LOG/upstream-durable-model.log"
      - name: Check real Cordis and TUI ownership lifecycle
        run: node scripts/check-upstream-lifecycle.mjs
      - name: Run real upstream PTY checks
        run: python3 scripts/live-upstream-tui.py
      - name: Record PTY reports in job logs
        if: always()
        run: |
          for report in live-full.json switch-deletions.jsonl; do
            if [ -f "$DSH_COMPAT_LOG/$report" ]; then
              echo "::group::$report"
              cat "$DSH_COMPAT_LOG/$report"
              echo "::endgroup::"
            fi
          done
      - name: Upload compatibility evidence (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-compat-${{ matrix.cell.pair }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ env.DSH_COMPAT_LOG }}
          if-no-files-found: error
          retention-days: 14
