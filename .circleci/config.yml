version: 2.1

orbs:
  node: circleci/node@7.2.1

executors:
  macos:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    environment:
      CI: "true"

commands:
  prepare:
    parameters:
      node-version:
        type: string
    steps:
      - checkout:
          method: full
      - run:
          name: Ensure complete source history
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow
            fi
            echo 'export NPM_CONFIG_CACHE="$HOME/.npm"' >> "$BASH_ENV"
      - node/install:
          node-version: << parameters.node-version >>
      - run:
          name: Verify runtimes
          command: |
            node --version
            python3 -c 'import sys; assert sys.version_info >= (3, 10), "Python 3.10+ required"; print(sys.version)'
      - restore_cache:
          keys:
            - npm-macos-arm64-node-<< parameters.node-version >>-v1-{{ checksum "package-lock.json" }}

jobs:
  package-check:
    executor: macos
    parameters:
      node-version:
        type: string
    steps:
      - prepare:
          node-version: << parameters.node-version >>
      - run:
          name: Package validation and CircleCI test suite
          no_output_timeout: 15m
          command: python3 ci/run_ci.py --suite package --node-version '<< parameters.node-version >>' --circleci
      - save_cache:
          key: npm-macos-arm64-node-<< parameters.node-version >>-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: ci-results
          destination: package-<< parameters.node-version >>

  live-upstream:
    executor: macos
    parameters:
      node-version:
        type: string
      pair:
        type: enum
        enum: [validated, merged-022]
    steps:
      - prepare:
          node-version: << parameters.node-version >>
      - run:
          name: Package gate and real upstream lifecycle and PTY validation
          no_output_timeout: 30m
          command: python3 ci/run_ci.py --suite live --node-version '<< parameters.node-version >>' --pair '<< parameters.pair >>'
      - save_cache:
          key: npm-macos-arm64-node-<< parameters.node-version >>-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - store_artifacts:
          path: ci-results
          destination: live-<< parameters.pair >>

workflows:
  session-cleanup-validation-macos:
    # Match pi-codemode-bench's GitHub App only-build-prs preset. The preset
    # excludes fork PRs; this expression additionally rejects automatic tags.
    when: >-
      pipeline.event.name == "api" or
      (pipeline.event.name == "push" and pipeline.event.github.ref == "refs/heads/main") or
      (pipeline.event.name == "pull_request" and
      (pipeline.event.action == "opened" or pipeline.event.action == "synchronize" or pipeline.event.action == "reopened"))
    jobs:
      - package-check:
          name: macos-package-node22
          node-version: "22.23.4"
      - package-check:
          name: macos-package-node24
          node-version: "24.22.1"
      - live-upstream:
          name: macos-live-validated
          node-version: "22.23.4"
          pair: validated
      - live-upstream:
          name: macos-live-merged-022
          node-version: "24.22.1"
          pair: merged-022
